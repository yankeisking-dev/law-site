<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ייעוץ משפטי</title>

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Heebo',sans-serif;
}

body{
    min-height:100vh;
    background:#0a0f1c;
}

/* LAYOUT */
.wrapper{
    display:flex;
    min-height:100vh;
}

/* HERO */
.hero{
    flex:1.4;
    position:relative;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        rgba(10,15,28,0.85),
        rgba(10,15,28,0.2)
    );
}

/* FORM SIDE */
.form-side{
    flex:0.9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.card{
    width:100%;
    max-width:460px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10);
    backdrop-filter:blur(20px);
    border-radius:18px;
    padding:40px;
    color:white;
}

/* TITLE */
h1{
    font-size:32px;
    font-weight:700;
    margin-bottom:30px;
    letter-spacing:0.3px;
}

/* FORM */
label{
    display:block;
    font-size:13px;
    color:#cbd5e1;
    margin-bottom:6px;
}

input, select{
    width:100%;
    height:50px;
    margin-bottom:16px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.03);
    color:white;
    padding:0 12px;
    outline:none;
    font-size:15px;
}

input:focus, select:focus{
    border-color:#3b82f6;
}

/* BUTTON */
button{
    width:100%;
    height:54px;
    border:none;
    border-radius:10px;
    background:#1d4ed8;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
    transition:0.25s;
}

button:hover{
    background:#2563eb;
    transform:translateY(-1px);
}

/* MOBILE */
@media(max-width:900px){
    .wrapper{
        flex-direction:column;
    }

    .hero{
        height:260px;
    }

    .card{
        padding:28px;
    }

    h1{
        font-size:26px;
        margin-bottom:20px;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- LEFT IMAGE -->
    <div class="hero">
        <img src="law-hero.jpg" alt="עורך דין">
    </div>

    <!-- FORM -->
    <div class="form-side">

        <div class="card">

            <h1>ייעוץ משפטי</h1>

            <form onsubmit="saveLead(event)">

                <label>שם</label>
                <input type="text" required>

                <label>גיל</label>
                <input type="number" required>

                <label>מייל</label>
                <input type="email" required>

                <label>תחום משפטי</label>
                <select required>
                    <option>פלילי</option>
                    <option>תעבורה</option>
                    <option>גירושין ומשפחה</option>
                    <option>נדל״ן</option>
                    <option>דיני עבודה</option>
                    <option>נזיקין</option>
                    <option>עסקי / חוזים</option>
                    <option>אחר</option>
                </select>

                <button type="submit">שליחה</button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
