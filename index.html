<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ייעוץ משפטי מהיר</title>

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Heebo',sans-serif;
}

body{
    min-height:100vh;
    background:#0b1220;
}

/* LAYOUT */
.wrapper{
    display:flex;
    min-height:100vh;
}

/* LEFT HERO */
.hero{
    flex:1.3;
    position:relative;
    overflow:hidden;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:contrast(1.05) saturate(1.1);
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:
    linear-gradient(90deg, rgba(11,18,32,0.75), rgba(11,18,32,0.2));
}

.hero-content{
    position:absolute;
    bottom:60px;
    right:60px;
    color:white;
    max-width:520px;
}

.hero-content h1{
    font-size:48px;
    font-weight:800;
    margin-bottom:15px;
}

.hero-content p{
    font-size:18px;
    line-height:1.6;
    opacity:0.9;
}

/* RIGHT FORM */
.form-side{
    flex:0.9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
    background:linear-gradient(180deg,#0b1220,#0f1a33);
}

.card{
    width:100%;
    max-width:520px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    border-radius:22px;
    padding:40px;
    color:white;
}

.badge{
    display:inline-block;
    background:#2563eb;
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    margin-bottom:18px;
    font-weight:600;
}

h2{
    font-size:34px;
    margin-bottom:10px;
}

.sub{
    color:#cbd5e1;
    margin-bottom:25px;
    font-size:15px;
}

label{
    font-size:14px;
    margin-bottom:6px;
    display:block;
    color:#e2e8f0;
}

input, select{
    width:100%;
    height:52px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.06);
    color:white;
    padding:0 12px;
    margin-bottom:14px;
    outline:none;
}

input:focus, select:focus{
    border-color:#3b82f6;
}

button{
    width:100%;
    height:56px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

.whatsapp{
    margin-top:12px;
    display:block;
    text-align:center;
    color:#25D366;
    font-weight:600;
    text-decoration:none;
}

.note{
    margin-top:12px;
    font-size:12px;
    color:#94a3b8;
    text-align:center;
}

/* MOBILE */
@media(max-width:900px){
    .wrapper{
        flex-direction:column;
    }

    .hero{
        height:300px;
    }

    .hero-content{
        right:20px;
        bottom:20px;
    }

    .hero-content h1{
        font-size:28px;
    }

    .form-side{
        padding:20px;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- HERO IMAGE -->
    <div class="hero">

        <img src="https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=1600&q=80">

        <div class="hero-content">
            <h1>זקוקים לעורך דין?</h1>
            <p>
                אנחנו מחברים אותך לעורך הדין המתאים ביותר עבורך במהירות וביעילות,
                לפי התחום המשפטי שלך.
            </p>
        </div>

    </div>

    <!-- FORM -->
    <div class="form-side">

        <div class="card">

            <div class="badge">ייעוץ משפטי מהיר</div>

            <h2>קבלת התאמה לעורך דין</h2>
            <div class="sub">מלאו פרטים ונחזור אליכם בהקדם</div>

            <form>

                <label>שם</label>
                <input type="text" required>

                <label>גיל</label>
                <input type="number" required>

                <label>מייל</label>
                <input type="email" required>

                <label>תחום משפטי</label>
                <select required>
                    <option>פלילי</option>
                    <option>תעבורה</option>
                    <option>גירושין ומשפחה</option>
                    <option>נדל״ן</option>
                    <option>דיני עבודה</option>
                    <option>נזיקין</option>
                    <option>עסקי / חוזים</option>
                    <option>אחר</option>
                </select>

                <button type="submit">מצא לי עורך דין</button>

            </form>

            <a class="whatsapp" href="https://wa.me/972000000000">
                שלח הודעה בוואטסאפ →
            </a>

            <div class="note">
                הפרטים שלך נשמרים בצורה מאובטחת בלבד
            </div>

        </div>

    </div>

</div>

</body>
</html>
