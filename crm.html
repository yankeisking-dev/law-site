<script>

// 🚨 NOW DATA COMES FROM REAL CRM SERVER (NOT LOCAL STORAGE)
let leads = [];

// LOAD DATA FROM SERVER
async function loadLeads(){

    try {
        const res = await fetch("http://localhost:3000/leads");
        leads = await res.json();
        render();

    } catch (err) {
        console.error("Failed to load leads:", err);
    }
}

function render(){
    const table = document.getElementById("dataTable");
    const empty = document.getElementById("empty");

    table.innerHTML = "";

    if(leads.length === 0){
        empty.style.display = "block";
        return;
    } else {
        empty.style.display = "none";
    }

    leads.forEach(lead => {
        const row = `
        <tr>
            <td>${lead.name || ""}</td>
            <td>${lead.age || ""}</td>
            <td>${lead.email || ""}</td>
            <td>${lead.type || ""}</td>
            <td>${lead.date || ""}</td>
        </tr>`;
        table.innerHTML += row;
    });
}

// EXPORT CSV (NOW FROM SERVER DATA)
function exportCSV(){

    let csv = "שם,גיל,מייל,תחום,תאריך\n";

    leads.forEach(l => {
        csv += `${l.name || ""},${l.age || ""},${l.email || ""},${l.type || ""},${l.date || ""}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "leads.csv";
    a.click();
}

// CLEAR DATA ON SERVER
async function clearData(){
    if(confirm("למחוק את כל הלידים?")){
        await fetch("http://localhost:3000/clear");
        loadLeads();
    }
}

// AUTO LOAD
loadLeads();

</script>
