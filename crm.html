<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.container{
    padding:30px;
}

h1{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#111a2e;
}

th, td{
    padding:12px;
    border-bottom:1px solid #222;
    text-align:left;
}

th{
    background:#1a2440;
}

#empty{
    margin-top:20px;
    color:#aaa;
}

.stats{
    margin-bottom:15px;
    padding:10px;
    background:#111a2e;
}
</style>
</head>

<body>

<div class="container">

<h1>CRM Leads</h1>

<div class="stats" id="stats">Loading...</div>

<table>
<thead>
<tr>
    <th>Name</th>
    <th>Age</th>
    <th>Email</th>
    <th>Type</th>
    <th>Date</th>
</tr>
</thead>

<tbody id="dataTable"></tbody>
</table>

<div id="empty">Loading leads...</div>

</div>

<script>

const API = "https://law-site-dkrr.onrender.com";

let leads = [];

// SAFE START
window.onload = function(){
    loadLeads();
};

// LOAD LEADS (FAIL SAFE)
async function loadLeads(){

    try {
        const res = await fetch(API + "/leads");
        const data = await res.json();

        leads = Array.isArray(data) ? data : [];

        render();

    } catch (err) {
        console.log("API error", err);
        leads = [];
        render();
    }
}

// RENDER (NEVER CRASHES)
function render(){

    const table = document.getElementById("dataTable");
    const empty = document.getElementById("empty");
    const stats = document.getElementById("stats");

    table.innerHTML = "";

    if(leads.length === 0){
        empty.style.display = "block";
        stats.innerHTML = "No leads yet";
        return;
    }

    empty.style.display = "none";

    let hot = 0;

    leads.forEach(l => {

        if(l.age >= 25 && l.age <= 55) hot++;

        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${l.name || ""}</td>
            <td>${l.age || ""}</td>
            <td>${l.email || ""}</td>
            <td>${l.type || ""}</td>
            <td>${l.date || ""}</td>
        `;

        table.appendChild(row);
    });

    stats.innerHTML = `
        Total Leads: ${leads.length} | Hot Leads: ${hot}
    `;
}

</script>

</body>
</html>
