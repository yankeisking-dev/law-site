<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת לידים משפטיים</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.container{
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

h1{
    font-size:22px;
}

.stats{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.card{
    background:#111a2e;
    padding:10px 15px;
    border-radius:10px;
    font-size:14px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#111a2e;
    border-radius:10px;
    overflow:hidden;
}

th, td{
    padding:12px;
    border-bottom:1px solid #222;
    font-size:14px;
}

th{
    background:#1a2440;
    color:#cbd5e1;
}

tr:hover{
    background:#16213a;
}

#empty{
    margin-top:20px;
    color:#94a3b8;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 מערכת לידים - ייעוץ משפטי</h1>
    </div>

    <div class="stats" id="stats"></div>

    <table>
        <thead>
            <tr>
                <th>שם</th>
                <th>גיל</th>
                <th>אימייל</th>
                <th>תחום משפטי</th>
                <th>סטטוס</th>
                <th>תאריך</th>
            </tr>
        </thead>

        <tbody id="dataTable"></tbody>
    </table>

    <div id="empty">טוען לידים...</div>

</div>

<script>

const API = "https://law-site-frdr.onrender.com";

let leads = [];

// safe start
window.onload = loadLeads;

// =============================
// LOAD LEADS (SAFE)
// =============================
async function loadLeads(){

    const empty = document.getElementById("empty");

    try {
        const res = await fetch(API + "/leads");

        if(!res.ok) throw new Error("API error");

        const data = await res.json();

        leads = Array.isArray(data) ? data : [];

    } catch (err) {
        console.log("LOAD ERROR:", err);
        leads = [];
        empty.innerText = "⚠️ שגיאה בטעינת נתונים מהשרת";
    }

    render();
}

// =============================
// STATUS CALC
// =============================
function getStatus(lead){

    let score = 0;

    if(lead.age >= 25 && lead.age <= 55) score += 2;
    if(lead.email) score += 1;
    if(lead.type) score += 1;

    if(score >= 3) return "🔥 חם";
    if(score === 2) return "🟠 בינוני";
    return "🔵 קר";
}

// =============================
// RENDER (SAFE)
// =============================
function render(){

    const table = document.getElementById("dataTable");
    const empty = document.getElementById("empty");
    const stats = document.getElementById("stats");

    table.innerHTML = "";

    if(!leads || leads.length === 0){
        empty.style.display = "block";
        stats.innerHTML = "";
        return;
    }

    empty.style.display = "none";

    let hot = 0, warm = 0, cold = 0;

    leads.forEach(l => {

        const status = getStatus(l);

        if(status === "🔥 חם") hot++;
        else if(status === "🟠 בינוני") warm++;
        else cold++;

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${l.name || "-"}</td>
            <td>${l.age || "-"}</td>
            <td>${l.email || "-"}</td>
            <td>${l.type || "-"}</td>
            <td>${status}</td>
            <td>${l.date ? new Date(l.date).toLocaleString() : "-"}</td>
        `;

        table.appendChild(row);
    });

    stats.innerHTML = `
        <div class="card">סה״כ לידים: ${leads.length}</div>
        <div class="card">🔥 חמים: ${hot}</div>
        <div class="card">🟠 בינוני: ${warm}</div>
        <div class="card">🔵 קרים: ${cold}</div>
    `;
}

</script>

</body>
</html>
