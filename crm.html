<script>

// =============================
// 🚀 PROFESSIONAL CRM ENGINE
// =============================

let leads = [];
let filteredLeads = [];

// -----------------------------
// LOAD LEADS FROM SERVER
// -----------------------------
async function loadLeads(){

    try {
        const res = await fetch("https://law-site-dkrr.onrender.com/crm.html");
        leads = await res.json();

        // newest first
        leads.reverse();

        filteredLeads = [...leads];

        updateStats();
        render();

    } catch (err) {
        console.error("Failed to load leads:", err);
    }
}

// -----------------------------
// LEAD SCORING (HOT / WARM / COLD)
// -----------------------------
function getLeadScore(lead){

    let score = 0;

    if(lead.age >= 25 && lead.age <= 55) score += 2;
    if(lead.type) score += 1;
    if(lead.email) score += 1;

    // simple heuristic
    if(score >= 3) return "🔥 HOT";
    if(score === 2) return "🟠 WARM";
    return "🔵 COLD";
}

// -----------------------------
// RENDER TABLE
// -----------------------------
function render(){

    const table = document.getElementById("dataTable");
    const empty = document.getElementById("empty");

    table.innerHTML = "";

    if(filteredLeads.length === 0){
        empty.style.display = "block";
        return;
    } else {
        empty.style.display = "none";
    }

    filteredLeads.forEach(lead => {

        const status = getLeadScore(lead);

        const row = `
        <tr>
            <td>${lead.name || ""}</td>
            <td>${lead.age || ""}</td>
            <td>${lead.email || ""}</td>
            <td>${lead.type || ""}</td>
            <td>${status}</td>
            <td>${lead.date || ""}</td>
        </tr>`;

        table.innerHTML += row;
    });
}

// -----------------------------
// SEARCH FUNCTION
// -----------------------------
function searchLeads(value){

    const v = value.toLowerCase();

    filteredLeads = leads.filter(l =>
        (l.name || "").toLowerCase().includes(v) ||
        (l.email || "").toLowerCase().includes(v) ||
        (l.type || "").toLowerCase().includes(v)
    );

    render();
}

// -----------------------------
// STATS PANEL
// -----------------------------
function updateStats(){

    const total = leads.length;
    const hot = leads.filter(l => getLeadScore(l) === "🔥 HOT").length;

    const statsEl = document.getElementById("stats");

    if(statsEl){
        statsEl.innerHTML = `
            <div>📊 Total Leads: <b>${total}</b></div>
            <div>🔥 Hot Leads: <b>${hot}</b></div>
        `;
    }
}

// -----------------------------
// EXPORT CSV
// -----------------------------
function exportCSV(){

    let csv = "שם,גיל,מייל,תחום,סטטוס,תאריך\n";

    filteredLeads.forEach(l => {
        csv += `${l.name || ""},${l.age || ""},${l.email || ""},${l.type || ""},${getLeadScore(l)},${l.date || ""}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "leads.csv";
    a.click();
}

// -----------------------------
// CLEAR DATA
// -----------------------------
async function clearData(){

    if(confirm("למחוק את כל הלידים?")){

        await fetch("https://law-site-dkrr.onrender.com/clear");

        loadLeads();
    }
}

// -----------------------------
// INIT
// -----------------------------
loadLeads();

</script>
